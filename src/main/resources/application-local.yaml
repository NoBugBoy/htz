# ── 安全 ──────────────────────────────────────────────────────────────────────
security:
  token:
    expire-seconds: 7200

# ── 对象存储 (RustFS / S3 兼容) ───────────────────────────────────────────────
knowflow:
  storage:
    rustfs:
      enabled: true
      endpoint: http://localhost:9000
      bucket-name: knowflow
      access-key: rustfsadmin
      secret-key: rustfsadmin
      region: us-east-1

  # ── 文档解析引擎 ─────────────────────────────────────────────────────────────
  # 可选值: AUTO | MARKITDOWN | MINERU
  # AUTO: 根据文件类型自动路由（推荐）
  parser:
    default-engine: AUTO
    # MarkItDown：部署独立 Python 微服务后填写，留空则降级为 Mock 引擎
    markitdown:
      endpoint:
    # MinerU：填写 MinerU 云端 API 或本地服务地址，留空则降级为 Mock 引擎
    mineru:
      endpoint:
      api-key:
