spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/testdb?currentSchema=public&reWriteBatchedInserts=true
    username: postgres
    password: root
  flyway:
    enabled: false
    baseline-on-migrate: true
  jpa:
    hibernate:
      # 量产阶段使用flyway 关闭 ddl-auto 改为validate
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  threads:
    virtual:
      enabled: true
wx:
