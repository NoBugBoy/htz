name: AI Code Governance with SonarCloud

on:
  workflow_dispatch: # 支持网页上手动点按钮触发
  push:
    branches:
      - htz          # 当代码 push 到 htz 分支时立即自动触发
      - hook         # 当前测试分支
      - main         # 如果后续切回 main 也会触发
    paths:
      - 'src/**'       # 只有 src 目录下的代码变动才触发
      - 'pom.xml'      # 或 build.gradle
      - '.github/**'   # 包含 .github 变动触发

# 显式声明所需权限
permissions:
  contents: write        # git push 新分支
  pull-requests: write   # 创建 PR
  issues: write          # 创建 Issue / 评论

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  sonar-and-ai:
    # 过滤掉包含 [skip ci] 以及 AI 自动修复 PR 的合并提交，防止合并后循环触发
    if: |
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip ci]') &&
       !contains(github.event.head_commit.message, '[ci skip]') &&
       !contains(github.event.head_commit.message, 'ai-fix-') &&
       !startsWith(github.event.head_commit.message, 'fix: AI 根据 Issue') &&
       !startsWith(github.event.head_commit.message, 'fix: AI 自动批量修复'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar 需要完整的 Git 历史来比对责任人和代码变更

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: "pip install --only-binary :all: requests==2.32.3 httpx==0.27.2 openai==1.55.0"

      # 1. 执行单元测试并生成 JaCoCo 覆盖率报告（JaCoCo 0.8.12 不兼容 Java 25，单测用 Java 21 运行）
      - name: Set up Java 21 for Tests
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Unit Tests & Generate Coverage
        run: mvn -B test

      # 恢复 Java 25 给后续 Sonar 分析使用
      - name: Set up Java 25 for Sonar
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 2. 编译并推送分析到 SonarCloud（核心步骤）
      - name: Build and analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests=true \
            -Dsonar.projectKey=NoBugBoy_htz \
            -Dsonar.organization=nobugboy \
            -Dsonar.host.url=https://sonarcloud.io

      # 2. 调用 Python 脚本通过 SonarCloud REST API 拉取刚才扫出来的缺陷，喂给 AI 自动修代码！
      - name: Fetch Sonar Issues and AI Triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: NoBugBoy_htz
          SONAR_BRANCH: ${{ vars.SONAR_BRANCH || github.ref_name }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://api.deepseek.com/v1' }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'deepseek-v4-flash' }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python .github/scripts/triage_sonar_with_ai.py