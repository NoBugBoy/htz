name: AI Code Governance with SonarCloud

on:
  workflow_dispatch:
  push:
    branches:
      - htz
    paths:
      - 'src/**'
      - 'pom.xml'

permissions:
  contents: write
  pull-requests: write
  issues: write
  workflows: write

jobs:
  sonar-and-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar 需要完整的 Git 历史来比对责任人和代码变更

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17' # 你的 JDK 版本
          distribution: 'temurin'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests openai

      # 1. 编译并推送分析到 SonarCloud（核心步骤）
      - name: Build and analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=你的_PROJECT_KEY \
            -Dsonar.organization=你的_ORGANIZATION_KEY \
            -Dsonar.host.url=https://sonarcloud.io \
            -DskipTests=true

      # 2. 调用 Python 脚本通过 SonarCloud REST API 拉取刚才扫出来的缺陷，喂给 AI 自动修代码！
      - name: Fetch Sonar Issues and AI Triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: 你的_PROJECT_KEY
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://api.openai.com/v1' }}
        run: |
          python .github/scripts/triage_sonar_with_ai.py